<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff7733"/>
      <stop offset="100%" style="stop-color:#cc3300"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="#000"/>
  <!-- diagonal texture lines -->
  <line x1="0" y1="170" x2="170" y2="0" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="340" x2="340" y2="0" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="172" y1="512" x2="512" y2="172" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="342" y1="512" x2="512" y2="342" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <!-- Dumbbell bar -->
  <rect x="176" y="240" width="160" height="32" rx="8" fill="url(#orange)" filter="url(#glow)"/>
  <!-- Left weight plates -->
  <rect x="124" y="192" width="56" height="128" rx="6" fill="#ff5500" opacity="0.95"/>
  <rect x="88" y="212" width="40" height="88" rx="4" fill="#cc3300"/>
  <!-- Right weight plates -->
  <rect x="332" y="192" width="56" height="128" rx="6" fill="#ff5500" opacity="0.95"/>
  <rect x="384" y="212" width="40" height="88" rx="4" fill="#cc3300"/>
  <!-- Collar rings -->
  <rect x="172" y="226" width="20" height="60" rx="4" fill="#ff7733"/>
  <rect x="320" y="226" width="20" height="60" rx="4" fill="#ff7733"/>
</svg>
